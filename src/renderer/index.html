<!doctype html>
<html lang="en" data-theme="daylight">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data: blob: https:; script-src 'self' file: 'unsafe-eval'; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: blob: https: http:">
<title>WhimFlow</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="../../node_modules/katex/dist/katex.min.css">
<link rel="stylesheet" href="content.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="editor.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div id="side-head">
      <button class="side-tab" data-tab="browse"></button>
      <button class="side-tab" data-tab="search"></button>
    </div>
    <div id="side-body">
      <div id="browse" class="side-pane">
        <section class="side-card" id="tree-card" data-island="files">
          <header class="card-head"><span class="eyebrow"></span><span class="card-meta"></span></header>
          <div id="tree" class="card-body"></div>
        </section>
        <div id="side-split"></div>
        <section class="side-card" id="outline-card" data-island="outline">
          <header class="card-head"><span class="eyebrow"></span><span class="card-meta"></span></header>
          <div id="outline" class="card-body"></div>
        </section>
      </div>
      <div id="search" class="side-pane side-card" data-island="search">
        <div class="search-box"><input id="search-input" type="text" spellcheck="false"><button class="search-opt" data-opt="caseSensitive">Aa</button><button class="search-opt" data-opt="word">ab</button><button class="search-opt" data-opt="regex">.*</button></div>
        <div id="search-status" class="eyebrow"></div>
        <div id="search-results"></div>
      </div>
    </div>
    <div id="side-resizer" class="resizer"></div>
  </aside>
  <main id="main">
    <header id="titlebar"><span id="doc-switch"><span id="title"></span><span id="title-state"></span><span id="doc-dots"></span></span></header>
    <div id="doc-list" hidden></div>
    <div id="findbar" hidden>
      <div class="find-row">
        <input id="find-input" type="text" spellcheck="false">
        <span id="find-count"></span>
        <button id="find-case">Aa</button>
        <button id="find-prev">&#8593;</button>
        <button id="find-next">&#8595;</button>
        <button id="find-close">&#10005;</button>
      </div>
      <div class="find-row" id="replace-row" hidden>
        <input id="replace-input" type="text" spellcheck="false">
        <button id="replace-one"></button>
        <button id="replace-all"></button>
      </div>
    </div>
    <div id="editor-wrap">
      <div id="editor"></div>
      <div id="welcome"><div class="eyebrow date"></div><h2></h2><svg class="squiggle" viewBox="0 0 120 12" width="120" height="12"><path pathLength="1" d="M3 8 C 18 2, 34 11, 52 6 S 86 2, 117 7"/></svg><p></p><ul></ul></div>
    </div>
    <footer id="statusbar">
      <button id="btn-sidebar"></button>
      <span class="spacer"></span>
      <span id="save-dot"></span>
      <span id="wordcount"></span>
      <button id="btn-right"></button>
    </footer>
  </main>
  <aside id="right">
    <div id="right-resizer" class="resizer"></div>
    <div id="right-head">
      <button class="right-tab" data-rtab="mindmap"></button>
      <button class="right-tab" data-rtab="preview"></button>
      <button class="right-tab" data-rtab="history"></button>
      <span id="right-label" class="eyebrow"></span>
    </div>
    <div id="right-body">
      <div id="mindmap" class="right-pane"><svg id="mm-svg" tabindex="0"><g id="mm-root"><g id="mm-links"></g><g id="mm-nodes"></g></g></svg><input id="mm-rename" type="text" spellcheck="false" hidden><div id="mm-hint" class="eyebrow"></div><div id="mm-empty" class="side-empty" hidden></div></div>
      <div id="preview" class="right-pane"><div id="preview-doc" class="doc"></div></div>
      <div id="history" class="right-pane"><div id="hist-list"></div><div id="hist-detail" hidden></div></div>
    </div>
  </aside>
</div>
<div id="bubble" hidden></div>
<div id="palette" hidden>
  <div class="palette-box">
    <span class="palette-prompt">&#8250;</span>
    <input id="palette-input" type="text" spellcheck="false">
    <div id="palette-list"></div>
    <div id="palette-foot" class="eyebrow"></div>
  </div>
</div>
<div id="modal" hidden>
  <div class="modal-box">
    <div id="modal-title"></div>
    <input id="modal-input" type="text" spellcheck="false">
    <div class="modal-actions"><button id="modal-cancel"></button><button id="modal-ok" class="primary"></button></div>
  </div>
</div>
<div id="settings" hidden>
  <div class="set-sheet" tabindex="-1">
    <div class="set-top"><span class="set-title"></span><button class="set-close">&#10005;</button></div>
    <div class="set-body"></div>
  </div>
</div>
<div id="doc-cycle" hidden></div>
<div id="toast" hidden></div>
<div id="tip" hidden></div>
<div id="print-doc" class="doc" aria-hidden="true"></div>
<script src="dist/app.js"></script>
</body>
</html>
